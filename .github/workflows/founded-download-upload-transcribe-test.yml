name: Founded download upload transcription test

on:
  push:
    branches: [zelro-render-theresia]
    paths:
      - '.github/workflows/founded-download-upload-transcribe-test.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Playwright
        run: |
          pip install playwright requests
          playwright install --with-deps chromium
      - name: Download public Reel then transcribe upload
        run: |
          cat > /tmp/run.py <<'PY'
          import asyncio, pathlib, requests, re
          from playwright.async_api import async_playwright

          reel='https://www.instagram.com/founded/reel/DcYvSGMNKVU/'
          out=pathlib.Path('/tmp/out'); out.mkdir(exist_ok=True)
          mp4=out/'reel.mp4'

          async def main():
            async with async_playwright() as p:
              browser=await p.chromium.launch(headless=True)
              page=await browser.new_page(accept_downloads=True, viewport={'width':1440,'height':1200})
              await page.goto('https://cliplatch.com/', wait_until='domcontentloaded', timeout=120000)
              inp=page.locator('input[placeholder*="Instagram" i], input[placeholder*="instagram.com" i]').first
              await inp.fill(reel)
              btn=page.get_by_role('button', name='Download', exact=True)
              await btn.click()
              await page.wait_for_timeout(5000)
              body=await page.locator('body').inner_text()
              (out/'cliplatch.txt').write_text(body, encoding='utf-8')
              # Collect candidate media links. Prefer actual mp4/video URL; otherwise click a result Download link and catch download.
              hrefs=await page.locator('a').evaluate_all('(els)=>els.map(e=>({text:e.innerText,href:e.href})).filter(x=>x.href)')
              (out/'links.txt').write_text('\n'.join(f"{x['text']}\t{x['href']}" for x in hrefs), encoding='utf-8')
              cand=[x['href'] for x in hrefs if '.mp4' in x['href'].lower() or 'cdninstagram' in x['href'].lower() or 'fbcdn' in x['href'].lower()]
              if cand:
                r=requests.get(cand[0], timeout=120, headers={'User-Agent':'Mozilla/5.0'}); r.raise_for_status(); mp4.write_bytes(r.content)
              else:
                # try result anchors/buttons containing Download, excluding original form button
                links=page.get_by_role('link', name=re.compile('download', re.I))
                if await links.count():
                  try:
                    async with page.expect_download(timeout=60000) as di:
                      await links.last.click()
                    d=await di.value; await d.save_as(str(mp4))
                  except Exception as e:
                    (out/'download_error.txt').write_text(repr(e), encoding='utf-8')
              print('MP4_EXISTS',mp4.exists(),'SIZE',mp4.stat().st_size if mp4.exists() else 0)
              if not mp4.exists() or mp4.stat().st_size < 10000:
                print(body); await browser.close(); return

              # Upload actual downloaded Reel to Shrybe; this uses its transcription website engine rather than URL fetch.
              s=await browser.new_page(viewport={'width':1440,'height':1200})
              await s.goto('https://shrybe.com/transcribe-instagram/', wait_until='domcontentloaded', timeout=120000)
              fi=s.locator('input[type=file]').first
              await fi.set_input_files(str(mp4))
              # upload may auto-start or expose a transcribe/go button
              for name in ['Go','Transcribe','Upload']:
                b=s.get_by_role('button', name=name, exact=True)
                if await b.count():
                  try: await b.first.click(timeout=5000)
                  except: pass
                  break
              for _ in range(180):
                await s.wait_for_timeout(1000)
                text=await s.locator('body').inner_text(); low=text.lower()
                if ('transcript ready' in low or 'download .txt' in low or 'download txt' in low or 'copy transcript' in low):
                  await s.wait_for_timeout(1000); break
                if "couldn't" in low and 'audio' in low: break
              text=await s.locator('body').inner_text()
              (out/'shrybe.txt').write_text(text, encoding='utf-8')
              await s.screenshot(path=str(out/'shrybe.png'), full_page=True)
              print('---SHRYBE---'); print(text)
              await browser.close()
          asyncio.run(main())
          PY
          python /tmp/run.py
      - name: Upload evidence
        uses: actions/upload-artifact@v4
        with:
          name: founded-download-upload-test
          path: /tmp/out
          if-no-files-found: error
