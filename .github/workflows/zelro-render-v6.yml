name: Zelro Reel 001 V6 Render

on:
  push:
    branches: [zelro-render-temp]
    paths:
      - 'zelro-render/**'
      - '.github/workflows/zelro-render-v6.yml'
  workflow_dispatch:

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    defaults:
      run:
        working-directory: zelro-render
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fluidsynth fluid-soundfont-gm
          python -m pip install --upgrade pip
          python -m pip install edge-tts mido
          npm install

      - name: Download and normalize real media
        run: python scripts/download_media.py

      - name: Generate natural male narration and word boundaries
        run: python scripts/generate_voice.py

      - name: Generate classical score and sound design
        run: python scripts/make_audio.py

      - name: Render 1080x1920 Reel
        run: |
          mkdir -p out
          npx remotion render src/index.tsx ZelroV6 out/raw.mp4 --codec=h264 --audio-codec=aac --crf=17 --pixel-format=yuv420p

      - name: Master to Instagram loudness target
        run: |
          ffmpeg -y -i out/raw.mp4 -c:v copy -af "loudnorm=I=-14:LRA=7:TP=-1.0" -c:a aac -b:a 192k -movflags +faststart out/Zelro_Elon_Nightclub_V6.mp4
          ffprobe -v error -show_entries stream=index,codec_name,width,height,r_frame_rate:format=duration -of default=noprint_wrappers=1 out/Zelro_Elon_Nightclub_V6.mp4 | tee out/TECHNICAL_REPORT.txt
          ffmpeg -hide_banner -i out/Zelro_Elon_Nightclub_V6.mp4 -af "loudnorm=I=-14:TP=-1:LRA=7:print_format=summary" -f null - 2>&1 | tee out/AUDIO_REPORT.txt

      - name: Create contact sheet preview
        run: |
          ffmpeg -y -i out/Zelro_Elon_Nightclub_V6.mp4 -vf "fps=1/2,scale=216:-1,tile=5x2" -frames:v 1 out/V6_PREVIEW.jpg || true

      - name: Upload finished Reel
        uses: actions/upload-artifact@v4
        with:
          name: zelro-elon-nightclub-v6-final
          path: |
            zelro-render/out/Zelro_Elon_Nightclub_V6.mp4
            zelro-render/out/V6_PREVIEW.jpg
            zelro-render/out/TECHNICAL_REPORT.txt
            zelro-render/out/AUDIO_REPORT.txt
          retention-days: 14
