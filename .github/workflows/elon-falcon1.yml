name: Zelro Reel 004 Elon Falcon 1 Final

on:
  push:
    branches: [zelro-render-elon-falcon1]
    paths:
      - 'zelro-render/**'
      - '.github/workflows/elon-falcon1.yml'
  workflow_dispatch:
    inputs:
      mode:
        description: 'Render a short diagnostic section or the final full Reel'
        required: true
        default: diagnostic
        type: choice
        options:
          - diagnostic
          - full
      start_frame:
        description: 'Diagnostic first frame'
        required: false
        default: '500'
      end_frame:
        description: 'Diagnostic last frame'
        required: false
        default: '575'

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      RENDER_MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.mode || 'full' }}
    defaults:
      run:
        working-directory: zelro-render
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Restore renderer dependencies
        id: dependency-cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/pip
            zelro-render/node_modules
          key: ${{ runner.os }}-zelro-dependencies-${{ hashFiles('zelro-render/package.json') }}
      - name: Install rendering dependencies
        run: |
          if ! command -v ffmpeg >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y ffmpeg
          fi
          python -m pip install --disable-pip-version-check edge-tts yt-dlp
          if [ ! -x node_modules/.bin/remotion ]; then npm install; fi
      - name: Restore normalized real media
        id: media-cache
        uses: actions/cache@v4
        with:
          path: |
            zelro-render/public/media/hook_launch.mp4
            zelro-render/public/media/island.mp4
            zelro-render/public/media/failure_fire.mp4
            zelro-render/public/media/flight_two.mp4
            zelro-render/public/media/cargo_plane.mp4
            zelro-render/public/media/repair_factory.mp4
            zelro-render/public/media/falcon_success.mp4
            zelro-render/public/media/ASSET_REPORT.txt
          key: zelro-falcon1-media-${{ hashFiles('zelro-render/scripts/download_media.py') }}
      - name: Download and quality-gate unique real media
        if: steps.media-cache.outputs.cache-hit != 'true'
        run: python scripts/download_media.py
      - name: Restore narration and exact caption timing
        id: narration-cache
        uses: actions/cache@v4
        with:
          path: |
            zelro-render/public/media/narration.mp3
            zelro-render/public/media/captions.json
            zelro-render/public/media/voice-candidates
            zelro-render/public/media/NARRATION_REPORT.txt
            zelro-render/src/timings.ts
          key: zelro-falcon1-narration-${{ hashFiles('zelro-render/scripts/generate_voice.py') }}
      - name: Generate narration candidates and exact captions
        if: steps.narration-cache.outputs.cache-hit != 'true'
        run: python scripts/generate_voice.py
      - name: Restore music and sound design
        id: audio-cache
        uses: actions/cache@v4
        with:
          path: |
            zelro-render/public/media/music.m4a
            zelro-render/public/media/*.wav
            zelro-render/public/media/MUSIC_AUDITION_REPORT.txt
          key: zelro-falcon1-audio-${{ hashFiles('zelro-render/scripts/make_audio.py') }}
      - name: Audition music and create motivated sound design
        if: steps.audio-cache.outputs.cache-hit != 'true'
        run: python scripts/make_audio.py
      - name: Verify final construction rules
        run: |
          npm run typecheck
          grep -q 'StageFailure' src/ElonFalcon.tsx
          grep -q 'SeparationFix' src/ElonFalcon.tsx
          grep -q 'LessonLoop' src/ElonFalcon.tsx
          grep -q 'CaptionLayer' src/ElonFalcon.tsx
          grep -q 'generated_images=0' public/media/ASSET_REPORT.txt
          grep -q 'source_reuse=0' public/media/ASSET_REPORT.txt
          if grep -Eqi 'elon.*\.(jpg|png)|musk.*\.(jpg|png)|talking.head' src/ElonFalcon.tsx; then
            echo 'Faceless rule violation detected'
            exit 1
          fi
      - name: Render targeted diagnostic section
        if: env.RENDER_MODE == 'diagnostic'
        run: |
          mkdir -p out/review
          npx remotion render src/index.tsx ZelroElonFalcon out/diagnostic.mp4 --frames=${{ inputs.start_frame }}-${{ inputs.end_frame }} --codec=h264 --audio-codec=aac --crf=20 --pixel-format=yuv420p
          ffmpeg -hide_banner -i out/diagnostic.mp4 -vf "blackdetect=d=0.20:pix_th=0.10" -an -f null - 2>&1 | tee out/DIAGNOSTIC_BLACK_FRAME_REPORT.txt
          ffmpeg -y -i out/diagnostic.mp4 -vf "fps=4,scale=180:-1,tile=5x4" -frames:v 1 out/review/DIAGNOSTIC_CONTACT.jpg
          if grep -q 'black_start' out/DIAGNOSTIC_BLACK_FRAME_REPORT.txt; then
            echo 'Diagnostic section still contains a black interval'
            exit 1
          fi
      - name: Upload diagnostic evidence only
        if: env.RENDER_MODE == 'diagnostic'
        uses: actions/upload-artifact@v4
        with:
          name: zelro-elon-falcon1-diagnostic
          path: |
            zelro-render/out/diagnostic.mp4
            zelro-render/out/DIAGNOSTIC_BLACK_FRAME_REPORT.txt
            zelro-render/out/review/DIAGNOSTIC_CONTACT.jpg
          retention-days: 3
      - name: Render full 1080x1920 Reel
        if: env.RENDER_MODE == 'full'
        run: |
          mkdir -p out/review
          npm run render:full
      - name: Master verified iPad exports
        if: env.RENDER_MODE == 'full'
        run: |
          ffmpeg -y -i out/raw.mp4 \
            -vf "scale=1080:1920:flags=lanczos,format=yuv420p" \
            -c:v libx264 -preset medium -profile:v high -level:v 4.1 -pix_fmt yuv420p \
            -b:v 5200k -maxrate 6200k -bufsize 10400k -g 60 -keyint_min 30 -sc_threshold 0 \
            -tag:v avc1 -color_primaries bt709 -color_trc bt709 -colorspace bt709 -color_range tv \
            -af "loudnorm=I=-14:LRA=7:TP=-1.0" -c:a aac -profile:a aac_low -b:a 160k -ar 48000 -ac 2 \
            -movflags +faststart -map_metadata -1 out/Zelro_Elon_Falcon1_iPad.mp4
          ffmpeg -y -i out/Zelro_Elon_Falcon1_iPad.mp4 \
            -vf "scale=720:1280:flags=lanczos,format=yuv420p" \
            -c:v libx264 -preset medium -profile:v main -level:v 3.1 -pix_fmt yuv420p \
            -b:v 2350k -maxrate 2850k -bufsize 4700k -g 60 -keyint_min 30 -sc_threshold 0 \
            -tag:v avc1 -color_primaries bt709 -color_trc bt709 -colorspace bt709 -color_range tv \
            -c:a aac -profile:a aac_low -b:a 128k -ar 48000 -ac 2 \
            -movflags +faststart -map_metadata -1 out/Zelro_Elon_Falcon1_iPad_Lite.mp4
      - name: Technical audio and decode verification
        if: env.RENDER_MODE == 'full'
        run: |
          ffprobe -v error -show_entries stream=index,codec_name,profile,level,pix_fmt,width,height,r_frame_rate,sample_rate,channels,color_range,color_space,color_transfer,color_primaries:format=start_time,duration,size,bit_rate -of json out/Zelro_Elon_Falcon1_iPad.mp4 | tee out/TECHNICAL_REPORT.txt
          ffprobe -v error -show_entries stream=index,codec_name,profile,level,pix_fmt,width,height,r_frame_rate,sample_rate,channels:format=start_time,duration,size -of json out/Zelro_Elon_Falcon1_iPad_Lite.mp4 | tee out/LITE_TECHNICAL_REPORT.txt
          ffmpeg -v error -i out/Zelro_Elon_Falcon1_iPad.mp4 -f null -
          ffmpeg -v error -i out/Zelro_Elon_Falcon1_iPad_Lite.mp4 -f null -
          ffmpeg -hide_banner -i out/Zelro_Elon_Falcon1_iPad.mp4 -af "loudnorm=I=-14:TP=-1:LRA=7:print_format=summary" -f null - 2>&1 | tee out/AUDIO_REPORT.txt
          ffmpeg -hide_banner -i out/Zelro_Elon_Falcon1_iPad.mp4 -vf "blackdetect=d=0.20:pix_th=0.10" -an -f null - 2>&1 | tee out/BLACK_FRAME_REPORT.txt
          if grep -q 'black_start' out/BLACK_FRAME_REPORT.txt; then
            echo 'Unmotivated black frame interval detected'
            exit 1
          fi
          sha256sum out/Zelro_Elon_Falcon1_iPad.mp4 out/Zelro_Elon_Falcon1_iPad_Lite.mp4 | tee out/DELIVERY_SHA256.txt
      - name: Create full visual review evidence
        if: env.RENDER_MODE == 'full'
        run: |
          ffmpeg -y -i out/Zelro_Elon_Falcon1_iPad.mp4 -vf "fps=1/2,scale=180:-1,tile=6x6" -frames:v 1 out/review/FULL_2S_CONTACT.jpg
          ffmpeg -y -i out/Zelro_Elon_Falcon1_iPad.mp4 -vf "fps=1,scale=140:-1,tile=7x10" -frames:v 1 out/review/FULL_1S_CONTACT.jpg
          for t in 0.5 2.0 6.0 12.0 18.0 24.0 30.0 36.0 42.0 49.0 56.0 63.0 67.0; do
            ffmpeg -y -ss "$t" -i out/Zelro_Elon_Falcon1_iPad.mp4 -frames:v 1 "out/review/key-${t}.png"
          done
      - name: Upload completed Reel 004
        if: env.RENDER_MODE == 'full'
        uses: actions/upload-artifact@v4
        with:
          name: zelro-elon-falcon1-final
          path: |
            zelro-render/out/Zelro_Elon_Falcon1_iPad.mp4
            zelro-render/out/Zelro_Elon_Falcon1_iPad_Lite.mp4
            zelro-render/out/TECHNICAL_REPORT.txt
            zelro-render/out/LITE_TECHNICAL_REPORT.txt
            zelro-render/out/AUDIO_REPORT.txt
            zelro-render/out/BLACK_FRAME_REPORT.txt
            zelro-render/out/DELIVERY_SHA256.txt
            zelro-render/out/review/FULL_2S_CONTACT.jpg
            zelro-render/out/review/FULL_1S_CONTACT.jpg
            zelro-render/out/review/key-*.png
            zelro-render/public/media/ASSET_REPORT.txt
            zelro-render/public/media/NARRATION_REPORT.txt
            zelro-render/public/media/MUSIC_AUDITION_REPORT.txt
          retention-days: 14
