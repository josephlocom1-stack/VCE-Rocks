name: Founded transcript extraction test

on:
  push:
    branches: [zelro-render-theresia]
    paths:
      - '.github/workflows/founded-transcript-test.yml'

jobs:
  transcribe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Playwright
        run: |
          pip install playwright
          playwright install --with-deps chromium
      - name: Transcribe one Founded Reel with EzTranscript web UI
        run: |
          cat > /tmp/transcribe.py <<'PY'
          import asyncio, pathlib
          from playwright.async_api import async_playwright

          URL = 'https://www.instagram.com/founded/reel/DcYvSGMNKVU/'
          OUT = pathlib.Path('/tmp/out')
          OUT.mkdir(exist_ok=True)

          async def main():
              async with async_playwright() as p:
                  browser = await p.chromium.launch(headless=True)
                  page = await browser.new_page(viewport={"width": 1440, "height": 1200})
                  await page.goto('https://eztranscript.net/reels-to-text', wait_until='domcontentloaded', timeout=120000)
                  inp = page.locator('input[placeholder*="Instagram Reel" i], input[placeholder*="instagram.com/reel" i], input[placeholder*="Paste" i]').first
                  await inp.fill(URL)
                  b = page.get_by_role('button', name='Get transcript', exact=False)
                  if await b.count():
                      await b.first.click()
                  else:
                      await inp.press('Enter')
                  # Wait long enough for the site's own fetch/transcription job. Do not confuse marketing text containing
                  # the word "transcript" with the actual result. Stop only after the loading label disappears, or after
                  # an explicit result/error marker is visible.
                  for _ in range(150):
                      await page.wait_for_timeout(1000)
                      body = await page.locator('body').inner_text()
                      low = body.lower()
                      loading = 'finding the video...' in low or 'transcribing' in low or 'processing' in low
                      result_marker = 'copy transcript' in low or 'download txt' in low or 'download srt' in low
                      error_marker = any(x in low for x in ["couldn't fetch", 'failed to fetch', 'unable to fetch', 'video not found', 'something went wrong'])
                      if (result_marker or error_marker) and not loading:
                          await page.wait_for_timeout(1500)
                          break
                  body = await page.locator('body').inner_text()
                  (OUT/'page.txt').write_text(body, encoding='utf-8')
                  await page.screenshot(path=str(OUT/'page.png'), full_page=True)
                  print(body)
                  await browser.close()

          asyncio.run(main())
          PY
          python /tmp/transcribe.py
      - name: Upload transcript evidence
        uses: actions/upload-artifact@v4
        with:
          name: founded-transcript-test
          path: /tmp/out
          if-no-files-found: error
